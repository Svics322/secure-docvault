<div class="confirm-overlay" data-ref="overlay" aria-hidden="true">
  <div class="confirm-dialog" role="dialog" aria-modal="true"
       aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <h2 class="confirm-title" id="confirm-title" data-ref="title"></h2>
    <p class="confirm-message" id="confirm-message" data-ref="message"></p>
    <div class="confirm-actions">
      <button class="button ghost" type="button" data-ref="cancel">Скасувати</button>
      <button class="button danger-solid" type="button" data-ref="confirm">Видалити</button>
    </div>
  </div>
</div>
